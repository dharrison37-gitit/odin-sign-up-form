<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Sign-up Form</title>
</head>

<body>
    <header class="site-header">
        <div class="logo">
            <img src="./img/odin-lined.png" alt="Odin" width="380" height="508">
            <h1>ODIN</h1>
        </div>
        <cite>Photo by <a href="https://unsplash.com/@aarsoph ">Kristijan Arsov</a> on <a
                href="https://unsplash.com">Unsplash</a></cite>
    </header>

    <main>

        <section class="upper">
            <p>This is not a real online service! You know you need something
                like this in your life to help you realize your deepest dream.</p>
            <p>Sign up <em>now</em> to get started.</p>
            <br>
            <p>You <em>know</em> you want to.</p>
        </section>

        <section class="form">
            <header class="form-header">
                <h3>Let's do this!</h3>
            </header>
            <form action="">
                <section class="name">
                    <div>
                        <label for="first-name">First Name</label>
                        <input type="text" name="first-name" id="first-name">
                    </div>
                    <div>
                        <label for="last-name">Last Name</label>
                        <input type="text" name="last-name" id="last-name">
                    </div>
                </section>
                <section class="contact">
                    <div>
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email">
                    </div>
                    <div>
                        <label for="phone">Phone Number</label>
                        <input type="tel" name="phone" id="phone">
                    </div>
                </section>
                <section class="password">
                    <div>
                        <label for="password">Password</label>
                        <input type="password" name="pwd" id="pwd" min="8" max="10">
                    </div>
                    <div>
                        <label for="confirm">Confirm Password</label>
                        <input type="password" name="confirm" id="confirm" min="8" max="10">
                    </div>
                </section>
            </form>
        </section>

        <section class="bottom">
            <button type="submit" class="submit">Create Account</button>
            <p>
                Already have an account? <a href="#">Log in</a>
            </p>
        </section>

    </main>

</body>

</html>
